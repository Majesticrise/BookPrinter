# ============================================
# BookPrinter 配置文件
# ============================================
# 语言设置: "zh_CN" (简体中文) ， "en_US" (English)，ES(Español)
# 语言文件位于插件目录下的 Language-zh_CN.yml
language: "zh_CN"
# 插件核心模式选择: "classic" 或 "modern"
# "classic": 作者写的原模式。支持传统的 & 颜色代码和 &#RRGGBB (Hex)。
#"modern": 新增功能,专为排版设计,支持classic所有功能。支持 RGB 渐变语法 &#RRGGBB (Hex) 支持传统的 & 颜色代码. 使用 \Line-break\ 强制翻页，\n 强制换行。
Switch-mode: "classic"
# 是否启用buy 命令（如果支付方式为金币则需要 Vault）
enable-buy-command: true
# 支付方式设置
payment:
  # 支付方式: money（金币）或 exp（经验）
  method: money
  # 当 method 为 exp 时，经验类型: level（经验等级）或 point（经验点数）
  exp-type: point
  # 购买所需金额/经验（经验等级/点数均为整数，但配置中可写小数，代码中取整）
  buy-price: 100.0

# ============================================
# Classic 模式配置 ( Switch-mode: "classic" 时生效 )
# ============================================
classic:
  # ★ 自动排版（强烈推荐保持开启）：
  # Minecraft 书本页面物理上只有 114 像素宽、14 行高，超出部分客户端直接裁剪不显示。
  # 原版字体是"比例字体"—— i、l、标点很窄，M、W 较宽，中文全角字符最宽，
  # 所以按"字符个数"分页必然溢出。开启本项后改用"像素宽度换行 + 14 行分页"，
  # 自动适应空格、标点、宽窄字母和中英文混排，从根源上杜绝每页内容超出不显示。
  # 开启后 max_chars_per_page 不再参与分页计算。
  auto_fit: true

  # 页面文本区像素宽度（原版书本为 114，请勿设置更大值；设小可留出安全边距）
  page_width_pixels: 114

  # 每页最大字符数（仅在 auto_fit: false 时生效，包含颜色代码字符）
  max_chars_per_page: 148

  # 分页策略: "smart" (智能), "lines" (按行数), "hard" (强制切断), "marker" (标记符)
  # auto_fit 开启时: "marker" 仍按标记先切分; "hard" 按像素硬断不找空格; 其余按空格智能断行
  split_strategy: "smart"

  # 当 split_strategy 为 "marker" 时，以此字符串作为分页标记
  page_marker: "---PAGE---"

  # 当 split_strategy 为 "lines" 时，每页最大行数
  # auto_fit 开启时此项即为每页行数上限，但最高不会超过书本物理上限 14 行
  max_lines_per_page: 14

  # 是否保留文本末尾的空行
  preserve_newlines: true

  # 是否移除最后生成的空白页
  trim_trailing_empty_pages: false

  # 路径安全设置
  allow_absolute_paths: false
  allow_subdirs: false

# ============================================
# Modern 模式配置 ( Switch-mode: "modern" 时生效 )
# ============================================
modern:
  # Modern 模式下，使用 Paper 的 MiniMessage 格式化引擎。
  # 这意味着你可以在 TXT 中使用以下高级语法:
  # <color:#red> 或 <#ff0000> 设置 RGB 颜色
  # <gradient:#red:#blue>文字</gradient> 制作渐变色
  # <b>粗体</b>, <i>斜体</i> 等基础格式
  #
  # 特殊控制符:
  # 在 TXT 中写入 \Line-break\  ->  书本的翻页
  # 在 TXT 中写入 \n            ->  书本的换行

  # 是否在解析前移除多余的空白字符（保留文本流）
  trim_whitespace: false

  # ★ 自动排版（强烈推荐保持开启）：
  # 将 \Line-break\ 之间的内容按"像素宽度换行 + 每页 14 行"自动分页，
  # 自动适应空格、标点、宽窄字母和中英文混排，超出内容不再被客户端裁剪。
  # 关闭后每个 \Line-break\ 段落就是一整页，过长内容仍会被裁掉底部。
  auto_fit: true

# ============================================
# 通用设置
# ============================================
# 允许读取的文件最大大小 (字节), 默认 2MB
max_file_bytes: 2097152
# 配置文件版本号，请勿手动修改以避免配置重置
config_version: "2.1"
